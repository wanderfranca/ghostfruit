    <path d="M-20 1200 Q120 1020 90 850 Q70 720 140 640 Q160 620 180 580 Q190 540 160 480 Q130 420 170 380 L185 390 Q150 430 180 480 Q210 530 195 580 Q180 620 155 645 Q85 730 110 860 Q140 1020 0 1210 Z" />
    <!-- Branch 1 -->
