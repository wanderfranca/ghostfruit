      <line x1="410" y1="920" x2="490" y2="920" />
      <line x1="512" y1="920" x2="589" y2="920" />
      <line x1="611" y1="920" x2="688" y2="920" />
      <line x1="710" y1="920" x2="790" y2="920" />
      <line x1="810" y1="920" x2="886" y2="920" />

      <line x1="314" y1="1020" x2="390" y2="1020" />
      <line x1="410" y1="1020" x2="490" y2="1020" />
      <line x1="512" y1="1020" x2="589" y2="1020" />
