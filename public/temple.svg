      <polygon points="445,1295 755,1295 745,1320 455,1320" />
      <polygon points="430,1320 770,1320 760,1350 440,1350" />
      <polygon points="415,1350 785,1350 775,1385 425,1385" />
      <polygon points="400,1385 800,1385 790,1425 410,1425" />
      <polygon points="380,1425 820,1425 810,1470 390,1470" />
