    <path d="M-50 1420 Q200 1380 400 1430 L400 1650 L-50 1650 Z" />
    <path d="M800 1430 Q1000 1380 1250 1420 L1250 1650 L800 1650 Z" />
    <path d="M300 1470 Q600 1440 900 1470 L900 1650 L300 1650 Z" />

