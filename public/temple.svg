      <rect x="540" y="555" width="8" height="10" />
      <rect x="570" y="555" width="8" height="10" />
      <rect x="600" y="555" width="8" height="10" />
      <rect x="630" y="555" width="8" height="10" />
      <rect x="660" y="555" width="8" height="10" />
      <rect x="690" y="555" width="8" height="10" />
      <rect x="720" y="555" width="8" height="10" />
      <rect x="750" y="555" width="8" height="10" />
      <rect x="780" y="555" width="8" height="10" />
      <rect x="810" y="555" width="8" height="10" />
      <rect x="840" y="555" width="8" height="10" />
