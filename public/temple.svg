<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf8e6" />
      <stop offset="50%" stop-color="#faedd0" />
      <stop offset="85%" stop-color="#f4e0be" />
      <stop offset="100%" stop-color="#ecd2ab" />
    </linearGradient>

    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="75%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <linearGradient id="templeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.8" />
    </linearGradient>

    <filter id="mistBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1200" height="1600" fill="url(#skyGrad)" />

  <!-- Giant Crimson Sun Disc -->
  <circle cx="600" cy="740" r="410" fill="url(#sunGrad)" />

  <!-- Atmospheric Background Clouds / Distant Foliage (Right) -->
  <g fill="#f1aa93" opacity="0.65">
    <ellipse cx="940" cy="580" rx="140" ry="60" />
    <ellipse cx="1020" cy="540" rx="110" ry="50" />
    <ellipse cx="880" cy="620" rx="90" ry="40" />
    <ellipse cx="980" cy="670" rx="130" ry="55" />
    <ellipse cx="1080" cy="730" rx="120" ry="50" />
    <ellipse cx="950" cy="760" rx="150" ry="65" />
    <ellipse cx="860" cy="830" rx="110" ry="45" />
    <ellipse cx="1020" cy="840" rx="140" ry="60" />
  </g>

  <!-- Distant Foliage (Left) -->
