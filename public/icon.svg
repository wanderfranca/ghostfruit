<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <circle cx="256" cy="265" r="140" fill="url(#ghostGrad)" opacity="0.85" filter="url(#glow)" />
  <!-- Ghost fruit eyes and mouth -->
  <circle cx="210" cy="240" r="18" fill="#ffffff" />
  <circle cx="215" cy="240" r="8" fill="#0b0f19" />
  <circle cx="302" cy="240" r="18" fill="#ffffff" />
  <circle cx="297" cy="240" r="8" fill="#0b0f19" />
  <ellipse cx="256" cy="285" rx="24" ry="34" fill="#0b0f19" />
  <!-- Stem / leaf -->
  <path d="M256 125 C256 85 290 80 300 70 C280 110 265 115 256 125 Z" fill="#22c55e" filter="url(#glow)" />
  <!-- Blade Slash Effect -->
  <path d="M70 420 Q240 260 440 90" stroke="#00f0ff" stroke-width="16" stroke-linecap="round" filter="url(#glow)" fill="none" />
  <path d="M70 420 Q240 260 440 90" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- Energy sparks -->
  <circle cx="380" cy="140" r="6" fill="#00f0ff" />
  <circle cx="160" cy="330" r="5" fill="#ec4899" />
  <circle cx="230" cy="200" r="4" fill="#ffff00" />
</svg>
